<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nembot Jules</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 40px;
            opacity: 0.7;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            text-decoration: underline;
            color: #00ffcc;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .blog-list {
            margin-top: 30px;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .blog-item {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .blog-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.2);
        }
        .date {
            font-size: 0.9em;
            color: #aaaaaa;
            margin-bottom: 5px;
        }
        .social-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-links a {
            padding: 10px;
            border: none;
            display: inline-block;
        }
        .social-links img {
            width: 30px;
            height: 30px;
            transition: transform 0.3s ease;
            filter: invert(1);
        }
        .social-links img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Nembot Jules</h1>
    <h2>Welcome to my brain dump</h2>
    
    <nav class="nav">
        <a href="#blog">Blog</a>
        <a href="about.html">About</a>

        <a href="#contact">Contact</a>
    </nav>
    
    <div id="blog" class="blog-list">
        <div class="blog-item">
            <div class="date">Jan 16, 2025</div>
            <a href="#">Common pitfalls when building generative AI applications</a>
        </div>
        <div class="blog-item">
            <div class="date">Jan 7, 2025</div>
            <a href="#">Agents</a>
        </div>
        <div class="blog-item">
            <div class="date">Jul 25, 2024</div>
            <a href="#">Building A Generative AI Platform</a>
        </div>
    </div>
    
    <div class="social-links">

        <a href="https://www.linkedin.com/in/nembotjules/" target="_blank"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" alt="LinkedIn"></a>
        <a href="https://x.com/Clinton_ai" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/60/X_logo_2023_original.svg" alt="X"></a>
    </div>
