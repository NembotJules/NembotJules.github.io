<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapses — Nembot Jules</title>
    <meta name="description" content="Coding timelapses and work sessions by Nembot Jules.">
    <meta property="og:title" content="Timelapses — Nembot Jules">
    <meta property="og:description" content="Coding timelapses and work sessions by Nembot Jules.">
    <script>
        // Early theme setting to avoid flash (default to dark for timelapses)
        (function() {
            const stored = localStorage.getItem('theme');
            if (stored) {
                document.documentElement.setAttribute('data-theme', stored);
            }
        })();
    </script>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/inter-variable.woff2') format('woff2-variations');
        }
        
        :root[data-theme="light"] {
            --bg: #ffffff;
            --text: #000000;
            --text-secondary: #666666;
            --border: #e5e5e5;
            --hover-bg: #f5f5f5;
            --tile-bg: #f9f9f9;
            --tile-hover: #f0f0f0;
        }
        
        :root[data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #f0f0f0;
            --text-secondary: #a0a0a0;
            --border: #2a2a2a;
            --hover-bg: #1a1a1a;
            --tile-bg: #1a1a1a;
            --tile-hover: #2a2a2a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 40px 20px 80px;
            max-width: 1200px;
            margin: 0 auto;
            transition: background-color 0.2s, color 0.2s;
        }
        
        a {
            color: var(--text);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        
        a:hover {
            opacity: 0.7;
        }
        
        nav {
            margin-bottom: 60px;
            font-size: 14px;
        }
        
        nav a {
            margin-right: 20px;
        }
        
        nav a:hover {
            border-bottom: 1px solid var(--text);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        
        .subtitle a {
            border-bottom: 1px solid var(--text);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }
        
        .tile {
            aspect-ratio: 1;
            background: var(--tile-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .tile:hover {
            background: var(--tile-hover);
            transform: translateY(-2px);
        }
        
        .tile-info {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
            text-align: center;
        }
        
        .tile:hover .tile-info {
            opacity: 1;
        }
        
        .tile-date {
            color: var(--text-secondary);
            display: block;
            margin-top: 2px;
        }
        
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, border-color 0.2s;
        }
        
        .theme-toggle:hover {
            background-color: var(--hover-bg);
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 10px;
            }
            
            .tile {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 30px 15px 80px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            nav a {
                margin-right: 15px;
            }
            
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 8px;
            }
            
            .tile {
                font-size: 18px;
            }
            
            footer {
                font-size: 12px;
                padding: 10px 15px;
            }
            
            .theme-toggle {
                font-size: 12px;
                padding: 3px 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/blog/index.html">Blog</a>
        <a href="/timelapses.html">Timelapses</a>
    </nav>
    
    <h1>Timelapses</h1>
    <p class="subtitle">coding timelapses on <a href="https://www.tiktok.com/@jules_clinton">TikTok</a> / <a href="https://x.com/Clinton_ai">X</a></p>
    
    <div class="grid" id="grid">
        <!-- Tiles will be loaded here -->
    </div>
    
    <footer class="site-footer">
        <p><span id="time" class="tabular-nums" style="visibility:hidden">0:00pm</span> in Yaoundé, Cameroon</p>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme"></button>
    </footer>
    <script src="/assets/site.js"></script>
    
    <script>
        
        // Load timelapses
        fetch('/timelapses.json')
            .then(response => response.json())
            .then(timelapses => {
                const grid = document.getElementById('grid');
                
                if (timelapses.length === 0) {
                    grid.innerHTML = '<p>No timelapses yet. Check back soon!</p>';
                    return;
                }
                
                // Sort by ID ascending (oldest = #1)
                timelapses.sort((a, b) => a.id - b.id);
                
                timelapses.forEach(timelapse => {
                    const tile = document.createElement('a');
                    tile.className = 'tile';
                    tile.href = timelapse.url;
                    tile.target = '_blank';
                    tile.rel = 'noopener noreferrer';
                    
                    const date = new Date(timelapse.date).toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    
                    tile.innerHTML = `
                        #${timelapse.id}
                        <div class="tile-info">
                            ${timelapse.title}
                            <span class="tile-date">${date}</span>
                        </div>
                    `;
                    
                    grid.appendChild(tile);
                });
            })
            .catch(error => {
                console.error('Error loading timelapses:', error);
                document.getElementById('grid').innerHTML = 
                    '<p>Error loading timelapses. Please try again later.</p>';
            });
    </script>
</body>
</html>
