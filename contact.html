<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 40px;
            opacity: 0.7;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            text-decoration: underline;
            color: #00ffcc;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .blog-list {
            margin-top: 30px;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .blog-item {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .blog-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.2);
        }
        .date {
            font-size: 0.9em;
            color: #aaaaaa;
            margin-bottom: 5px;
        }
        .social-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-links a {
            padding: 10px;
            border: none;
            display: inline-block;
        }
        .social-links img {
            width: 30px;
            height: 30px;
            transition: transform 0.3s ease;
            filter: invert(1);
        }
        .social-links img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Contact Me</h1>
    <form action="mailto:juniorbertrand761@gmail.com" method="post" enctype="text/plain">
        <input type="text" name="name" placeholder="Your Name" required><br>
        <input type="email" name="email" placeholder="Your Email" required><br>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea><br>
        <button type="submit">Send</button>
    </form>
</body>
</html>
